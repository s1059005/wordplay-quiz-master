# 部署 Vite 專案到 GitHub Pages 的工作流
name: 部署到 GitHub Pages

on:
  push:
    branches: ["main"] # 當發生推送到 main 分支時觸發

  # 允許從 Actions 頁面手動執行
  workflow_dispatch:

# 設定權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保只有一個部署任務在執行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 安裝依賴項 (使用 npm ci 以確保環境一致性)
        run: npm ci --legacy-peer-deps

      - name: 構建專案
        run: npm run build
        env:
          VITE_TTS_API_BASE_URL: ${{ secrets.VITE_TTS_API_BASE_URL }}

      - name: 上傳構建產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

